apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: efk-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ChandraShekharSaini/self-healing-infra.git
    path: efk-stack
    targetRevision: master
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-logging
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true     
